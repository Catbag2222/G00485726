<!-- Header bar at the top of the page -->
<ion-header>
  <ion-toolbar style="--background: #3880ff; --color: white;">

    <!-- Shows the movie title passed from the home page -->
    <!-- The ? means if movie is null, don't crash - just show nothing -->
    <ion-title>{{ movie?.title }}</ion-title>

    <!-- Home and heart icons on the right side of the toolbar -->
    <ion-buttons slot="end">

      <!-- Goes back to the home page when clicked -->
      <ion-button (click)="goHome()">
        <ion-icon name="home" style="color:white; font-size:24px"></ion-icon>
      </ion-button>

      <!-- Goes to the favourites page when clicked -->
      <ion-button (click)="goToFavourites()">
        <ion-icon name="heart" style="color:red; font-size:24px"></ion-icon>
      </ion-button>

    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- Shows the movie description from the TMDB API -->
  <p>{{ movie?.overview }}</p>

  <!-- Add/Remove favourites button -->
  <!-- [color] changes the button colour based on isFavourite -->
  <!-- The text also changes depending on if it's already a favourite -->
  <ion-button (click)="toggleFavourite()" [color]="isFavourite ? 'danger' : 'primary'">
    {{ isFavourite ? 'REMOVE FROM FAVOURITES' : 'ADD TO FAVOURITES' }}
  </ion-button>

  <h3>Cast</h3>

  <!-- CSS grid layout matching the home page - 5 columns of cast member tiles -->
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:5px; padding:5px;">
    <div *ngFor="let person of cast" (click)="goToPerson(person)" style="text-align:center">
      <img *ngIf="person.profile_path" [src]="getImage(person.profile_path)" style="width:100%; border-radius:5px"/>
      <p style="font-size:11px; margin:2px 0; color:white; font-weight:bold">{{ person.name }}</p>
      <p style="font-size:10px; margin:2px 0; color:lightgrey">{{ person.character }}</p>
    </div>
  </div>

  <h3>Crew</h3>

  <!-- CSS grid layout matching the home page - 5 columns of crew member tiles -->
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:5px; padding:5px;">
    <div *ngFor="let person of crew" (click)="goToPerson(person)" style="text-align:center">
      <img *ngIf="person.profile_path" [src]="getImage(person.profile_path)" style="width:100%; border-radius:5px"/>
      <p style="font-size:11px; margin:2px 0; color:white; font-weight:bold">{{ person.name }}</p>
      <p style="font-size:10px; margin:2px 0; color:lightgrey">{{ person.job }}</p>
    </div>
  </div>

</ion-content>
